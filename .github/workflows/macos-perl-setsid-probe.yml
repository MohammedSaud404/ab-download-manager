name: macOS perl setsid probe

on:
  workflow_dispatch:

jobs:
  perl-info:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, macos-15, macos-15-intel ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Is /usr/bin/perl part of the stock OS
        run: |
          sw_vers
          echo "arch: $(uname -m)"
          echo "--- command -v perl: $(command -v perl)"
          ls -l /usr/bin/perl /usr/bin/perl5* 2>&1 || true
          echo "--- version (stderr included, to catch deprecation warnings):"
          /usr/bin/perl -e 'print "$^V\n"' 2>&1
          echo "--- signature:"
          codesign -dvv /usr/bin/perl 2>&1 | grep -E 'Identifier|Authority|Platform' || true
          echo "--- linked libraries (an xcode-select shim would link libxcselect):"
          otool -L /usr/bin/perl
          echo "--- is / the sealed system volume:"
          diskutil info / | grep -Ei 'sealed|volume name|mount point' || true
          echo "--- which package installed it:"
          pkgutil --file-info /usr/bin/perl 2>&1 || true
          echo "--- POSIX module loads:"
          /usr/bin/perl -MPOSIX -e 'print "POSIX ok, setsid is ", (defined &POSIX::setsid ? "defined" : "MISSING"), "\n"'

  launch:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, macos-15, macos-15-intel ]
        pkg: [ tar.gz, dmg ]
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      APP: /Applications/ABDownloadManager.app
      GUI: /Applications/ABDownloadManager.app/Contents/MacOS/ABDownloadManager
      CLI: /Applications/ABDownloadManager.app/Contents/MacOS/ABDownloadManagerCli
      FILE: ABDownloadManager_1.10.4_mac_${{ matrix.arch }}.${{ matrix.pkg }}
      # the wrapper that would replace `setsid <exe> <args>` on macOS
      PERL_SETSID: 'my $s = POSIX::setsid(); die "setsid failed: $!\n" unless defined($s) && $s > 0; exec { $ARGV[0] } @ARGV or die "exec failed: $!\n"'
    steps:
      - name: Runner info
        run: |
          sw_vers
          echo "arch: $(uname -m)  package: $FILE"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download official v1.10.4
        run: curl -sfL -o "$FILE" "https://github.com/amir1376/ab-download-manager/releases/download/v1.10.4/$FILE"

      - name: Install from tar.gz
        if: matrix.pkg == 'tar.gz'
        run: sudo tar -xzf "$FILE" -C /Applications

      - name: Install from dmg
        if: matrix.pkg == 'dmg'
        run: |
          yes | hdiutil attach -nobrowse -noverify -noautoopen -mountpoint /Volumes/abdm "$FILE" >/dev/null
          sudo cp -R /Volumes/abdm/ABDownloadManager.app /Applications/
          hdiutil detach /Volumes/abdm

      - name: Write the Java launcher (same ProcessBuilder setup as DetachedLauncher.execViaSetsid)
        run: |
          cat > "$RUNNER_TEMP/Launch.java" <<'EOF'
          import java.io.File;
          import java.util.Arrays;

          public class Launch {
              public static void main(String[] cmd) throws Exception {
                  // cmd[0] is "wrap" (use perl) or "plain" (no detach), the rest is <exe> <args>
                  boolean wrap = cmd[0].equals("wrap");
                  String[] exeAndArgs = Arrays.copyOfRange(cmd, 1, cmd.length);
                  java.util.List<String> command = new java.util.ArrayList<>();
                  if (wrap) {
                      command.addAll(Arrays.asList("/usr/bin/perl", "-MPOSIX", "-e", System.getenv("PERL_SETSID"), "--"));
                  }
                  command.addAll(Arrays.asList(exeAndArgs));
                  System.out.println("[cli] pid=" + ProcessHandle.current().pid() + " starting " + command);
                  new ProcessBuilder(command)
                      .directory(new File(exeAndArgs[0]).getParentFile())
                      .redirectOutput(ProcessBuilder.Redirect.DISCARD)
                      .redirectError(ProcessBuilder.Redirect.DISCARD)
                      .redirectInput(ProcessBuilder.Redirect.from(new File("/dev/null")))
                      .start();
                  // like the CLI: return right away without waiting for the child
              }
          }
          EOF

      - name: Write the fake browser test
        run: |
          cat > "$RUNNER_TEMP/browser.py" <<'EOF'
          import os, signal, subprocess, sys, time

          mode, match, exe_and_args = sys.argv[1], sys.argv[2], sys.argv[3:]
          LAUNCH = os.path.join(os.environ["RUNNER_TEMP"], "Launch.java")

          def procs():
              out = subprocess.run(["ps", "-axo", "pid=,ppid=,pgid=,args="], capture_output=True, text=True).stdout
              rows = []
              for l in out.splitlines():
                  if match in l and "browser.py" not in l and "Launch.java" not in l and "perl" not in l.split()[3]:
                      pid = int(l.split()[0])
                      try:
                          sid = os.getsid(pid)
                      except OSError:
                          sid = "?"
                      rows.append((pid, f"{l}   sid={sid}"))
              return rows

          # Fake browser: own session and process group, like a browser running a native messaging host.
          # The native host runs the CLI (a java process) which launches the target and exits.
          browser = os.fork()
          if browser == 0:
              os.setsid()
              r = subprocess.run(["java", LAUNCH, mode] + exe_and_args)
              print(f"[browser] pid={os.getpid()} sid={os.getsid(0)} cli exit code = {r.returncode}", flush=True)
              time.sleep(120)
              os._exit(0)

          for _ in range(40):
              time.sleep(1)
              if procs():
                  break
          time.sleep(3)
          print(f"--- fake browser pid={browser} (its pgid and sid are {browser})")
          print("--- target process before the kill (pid ppid pgid args sid):")
          for _, l in procs():
              print("   ", l)

          print(f"--- SIGKILL to the whole fake browser process group {browser}")
          os.killpg(browser, signal.SIGKILL)
          os.waitpid(browser, 0)
          time.sleep(5)
          after = procs()
          print("--- target process after the kill:")
          for _, l in after:
              print("   ", l)
          alive = bool(after)
          print(f"RESULT mode={mode}: " + ("target SURVIVED" if alive else "target DIED"))
          sys.exit(0 if alive == (mode == "wrap") else 1)
          EOF

      - name: "Test 1: GUI through java -> perl setsid, then kill the browser"
        run: |
          pgrep -fl "ABDownloadManager.app" && { echo "app already running, unexpected"; exit 1; } || echo "app is not running (expected)"
          python3 "$RUNNER_TEMP/browser.py" wrap "/ABDownloadManager.app/Contents/MacOS/" "$GUI" --background

      - name: "Test 1b: the app is fully up (single instance check)"
        run: |
          set +e
          "$CLI" gui start-if-not-started; echo "exit=$?"
          set -e
          pkill -f "ABDownloadManager.app" || true
          sleep 2

      - name: "Test 2: a non-default executable is preserved (CLI through perl setsid)"
        run: |
          echo "--- CLI run directly:"
          set +e
          "$CLI" --help > direct.txt 2>&1; echo "exit=$?"
          echo "--- CLI run through the perl wrapper:"
          /usr/bin/perl -MPOSIX -e "$PERL_SETSID" -- "$CLI" --help > wrapped.txt 2>&1; echo "exit=$?"
          set -e
          cat wrapped.txt
          if cmp -s direct.txt wrapped.txt; then echo "RESULT: same output as the direct run"; else echo "RESULT: output DIFFERS"; diff direct.txt wrapped.txt || true; fi

      - name: "Test 3: any executable is detached (/bin/sleep through java -> perl setsid)"
        run: python3 "$RUNNER_TEMP/browser.py" wrap "/bin/sleep 777" /bin/sleep 777

      - name: "Control: GUI as a plain child of the CLI, then kill the browser"
        run: |
          pkill -f "sleep 777" || true
          python3 "$RUNNER_TEMP/browser.py" plain "/ABDownloadManager.app/Contents/MacOS/" "$GUI" --background
          pkill -f "ABDownloadManager.app" || true

      - name: "Edge: perl setsid when the caller is already a process group leader"
        run: |
          # setsid() fails with EPERM for a group leader. ProcessBuilder children are never group leaders,
          # this only shows the error is reported instead of silently not detaching.
          set +e
          python3 -c 'import os,sys; os.setpgid(0,0); os.execv("/usr/bin/perl", ["perl","-MPOSIX","-e",os.environ["PERL_SETSID"],"--","/bin/echo","should not print"])'
          echo "exit=$?"
          exit 0

      - name: "Edge: what POSIX::setsid returns (leader vs not leader)"
        env:
          DIAG: 'my $s = POSIX::setsid(); printf "pid=%d setsid returned %s errno=%s\n", $$, (defined $s ? "[$s]" : "undef"), ($! + 0) . " $!"'
        run: |
          echo "--- not a group leader (child of this shell):"
          /usr/bin/perl -MPOSIX -e "$DIAG"
          echo "--- already a group leader:"
          python3 -c 'import os; os.setpgid(0,0); os.execv("/usr/bin/perl", ["perl","-MPOSIX","-e",os.environ["DIAG"]])'
