name: PR 1444 build and test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch to build
        default: test/pr-1444

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, macos-15, macos-15-intel ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Checkout the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JBR (same as upstream publish.yml)
        uses: actions/setup-java@v4
        with:
          distribution: "jetbrains"
          java-package: "jdk"
          java-version: "25"
          check-latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build packages (same as upstream publish.yml)
        env:
          SKIP_ANDROID_BUILD: "true"
        run: |
          sw_vers
          clang --version | head -1
          xcrun --show-sdk-version
          git log --oneline -1
          brew install create-dmg
          ./gradlew
          ./gradlew createReleaseFolderForCi
          ./gradlew -stop
          echo "--- build/ci-release:"
          find build/ci-release -maxdepth 2 -type f | sort

      - name: Inspect the compiled setsid helper
        run: |
          H=desktop/mac_utils/build/generated/resources/native/macos/setsid
          ls -l "$H"
          file "$H"
          lipo -info "$H"
          echo "--- build version per slice (minos = oldest macOS it will run on):"
          for a in arm64 x86_64; do echo "[$a]"; otool -arch $a -l "$H" | grep -A5 LC_BUILD_VERSION | grep -E 'minos|sdk'; done
          echo "--- signature:"
          codesign -dv "$H" 2>&1 | grep -E 'Format|Signature|flags|Identifier' || true
          echo "--- runner OS: $(sw_vers -productVersion)"

      - name: "Edge: helper when the caller is already a process group leader (fork path)"
        run: |
          H=desktop/mac_utils/build/generated/resources/native/macos/setsid
          set +e
          python3 -c 'import os,sys; os.setpgid(0,0); print(f"caller pid={os.getpid()} pgid={os.getpgrp()}", flush=True); os.execv(sys.argv[1], [sys.argv[1], "/bin/sleep", "778"])' "$H"
          echo "helper exit=$?"
          sleep 2
          python3 - <<'PY'
          import os, subprocess
          out = subprocess.run(["ps", "-axo", "pid=,ppid=,pgid=,args="], capture_output=True, text=True).stdout
          rows = [l for l in out.splitlines() if l.split(None, 3)[3:] == ["/bin/sleep 778"]]
          for l in rows:
              pid = int(l.split()[0]); print("   ", l, f"sid={os.getsid(pid)}")
          ok = rows and all(int(l.split()[0]) == int(l.split()[2]) == os.getsid(int(l.split()[0])) for l in rows)
          print("EDGE fork path PASS" if ok else "EDGE fork path FAIL")
          PY
          pkill -f "sleep 778" || true

      - name: "Edge: quarantined copy of the helper"
        run: |
          H=desktop/mac_utils/build/generated/resources/native/macos/setsid
          spctl --status || true
          run_with_limit() {
            "$@" & p=$!
            for i in $(seq 1 20); do kill -0 $p 2>/dev/null || break; sleep 1; done
            if kill -0 $p 2>/dev/null; then echo "still running after 20s (blocked or hung)"; kill -9 $p; fi
            wait $p; echo "exit=$?"
          }
          cp "$H" "$RUNNER_TEMP/plain-setsid"
          cp "$H" "$RUNNER_TEMP/quarantined-setsid"
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Google Chrome;" "$RUNNER_TEMP/quarantined-setsid"
          xattr -l "$RUNNER_TEMP/quarantined-setsid"
          echo "--- control, no quarantine:"
          set +e
          run_with_limit "$RUNNER_TEMP/plain-setsid" /bin/echo "plain helper ran"
          echo "--- with quarantine:"
          run_with_limit "$RUNNER_TEMP/quarantined-setsid" /bin/echo "quarantined helper ran"
          echo "--- syspolicy log (last 2 min):"
          log show --last 2m --predicate 'process == "syspolicyd" OR process == "kernel"' 2>/dev/null | grep -i -E 'setsid|quarantine' | tail -15 || true

      - name: "Edge: is the minimum macOS version enforced for a plain executable"
        run: |
          S=desktop/mac_utils/src/main/native/setsid.c
          set +e
          clang "$S" -O2 -mmacosx-version-min=11.0 -o "$RUNNER_TEMP/min11" && \
            otool -l "$RUNNER_TEMP/min11" | grep -A5 LC_BUILD_VERSION | grep minos
          "$RUNNER_TEMP/min11" /bin/echo "minos 11.0 ran"; echo "exit=$?"
          clang "$S" -O2 -mmacosx-version-min=27.0 -o "$RUNNER_TEMP/min27" && \
            otool -l "$RUNNER_TEMP/min27" | grep -A5 LC_BUILD_VERSION | grep minos
          "$RUNNER_TEMP/min27" /bin/echo "minos 27.0 ran"; echo "exit=$?"

      - name: Write the test script
        run: |
          cat > "$RUNNER_TEMP/test.sh" <<'EOF'
          #!/bin/bash
          PKG="$1"
          APP=/Applications/ABDownloadManager.app
          CLI="$APP/Contents/MacOS/ABDownloadManagerCli"
          TMPD="$(getconf DARWIN_USER_TEMP_DIR)"
          echo "================ PACKAGE: $(basename "$PKG")"
          sudo rm -rf "$APP"
          case "$PKG" in
            *.tar.gz) sudo tar -xzf "$PKG" -C /Applications ;;
            *.dmg)
              yes | hdiutil attach -nobrowse -noverify -noautoopen -mountpoint /Volumes/abdm "$PKG" >/dev/null
              sudo cp -R /Volumes/abdm/ABDownloadManager.app /Applications/
              hdiutil detach /Volumes/abdm >/dev/null ;;
          esac
          ls -l "$APP/Contents/MacOS/"
          echo "app LSMinimumSystemVersion: $(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist" 2>&1)"
          for j in "$APP"/Contents/app/*.jar; do unzip -l "$j" 2>/dev/null | grep 'native/macos/setsid' && echo "  ^ in $(basename "$j")"; done
          tmp_helpers() { ls "$TMPD" 2>/dev/null | grep -c '^abdm_setsid' ; }
          app_ps() { ps -axo pid=,ppid=,pgid=,args= | grep "[/]ABDownloadManager.app/Contents/MacOS/ABDownloadManager " || true; }
          stop_app() { pkill -f "ABDownloadManager.app/Contents/MacOS/ABDownloadManager" || true; sleep 3; }

          stop_app
          echo "---- TEST 1: CLI gui start-if-not-started with the app not running"
          echo "app before: $(app_ps)"
          echo "temp helper files before: $(tmp_helpers)"
          "$CLI" gui start-if-not-started >out.txt 2>err.txt; code=$?
          echo "exit=$code"; echo "stdout: $(cat out.txt)"; echo "stderr:"; cat err.txt
          echo "app after (pid ppid pgid args):"; app_ps
          echo "temp helper files after the CLI exited: $(tmp_helpers)"
          [ "$code" = 0 ] && grep -qx Started out.txt && echo "TEST 1 PASS" || echo "TEST 1 FAIL"

          echo "---- TEST 2: CLI again while running"
          "$CLI" gui start-if-not-started >out.txt 2>err.txt; code=$?
          echo "exit=$code stdout: $(cat out.txt)"
          [ "$code" = 0 ] && grep -qx AlreadyRunning out.txt && echo "TEST 2 PASS" || echo "TEST 2 FAIL"

          stop_app
          echo "---- TEST 3: CLI run from a fake browser session, then the browser group is killed"
          python3 - "$CLI" <<'PY'
          import os, signal, subprocess, sys, time
          cli = sys.argv[1]
          def app():
              out = subprocess.run(["ps", "-axo", "pid=,ppid=,pgid=,args="], capture_output=True, text=True).stdout
              return [l for l in out.splitlines() if "/ABDownloadManager.app/Contents/MacOS/ABDownloadManager " in l]
          r, w = os.pipe()
          browser = os.fork()
          if browser == 0:
              os.setsid()
              p = subprocess.run([cli, "gui", "start-if-not-started"], capture_output=True, text=True)
              os.write(w, f"{p.returncode}|{p.stdout.strip()}|{p.stderr.strip()}".encode())
              time.sleep(120)
              os._exit(0)
          os.close(w)
          res = os.read(r, 65536).decode()
          print(f"[browser pgid={browser}] cli result: {res}")
          print("app while browser alive:")
          for l in app():
              print("   ", l, f"sid={os.getsid(int(l.split()[0]))}")
          os.killpg(browser, signal.SIGKILL); os.waitpid(browser, 0); time.sleep(5)
          procs = app()
          print("app after browser group killed:")
          for l in procs:
              print("   ", l, f"sid={os.getsid(int(l.split()[0]))}")
          ok = res.startswith("0|Started") and procs and all(str(browser) != l.split()[2] for l in procs)
          print("TEST 3 PASS" if ok else "TEST 3 FAIL")
          PY
          "$CLI" gui start-if-not-started; echo "exit=$? (expect AlreadyRunning)"
          echo "temp helper files at the end: $(tmp_helpers)"
          stop_app
          EOF
          chmod +x "$RUNNER_TEMP/test.sh"

      - name: Test tar.gz
        run: '"$RUNNER_TEMP/test.sh" "$(find "$GITHUB_WORKSPACE/build/ci-release" -name "*mac*.tar.gz" | head -1)"'

      - name: Test dmg
        run: '"$RUNNER_TEMP/test.sh" "$(find "$GITHUB_WORKSPACE/build/ci-release" -name "*mac*.dmg" | head -1)"'
